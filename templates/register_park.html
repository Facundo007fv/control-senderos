<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Parque - TrailControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-2xl w-full text-slate-800 border border-emerald-900/10">
        <div class="text-center mb-6">
            <div class="inline-block bg-emerald-600 text-white p-3 rounded-2xl text-2xl shadow-md mb-2">🌲</div>
            <h2 class="text-2xl font-black text-slate-900">Registrar Nuevo Parque / Reserva</h2>
            <p class="text-xs text-slate-500">Completa los datos y haz clic en el mapa para fijar la ubicación</p>
        </div>
        
        {% if error %}
            <div class="bg-rose-100 text-rose-700 text-xs font-bold p-3 rounded-xl mb-4 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre del Parque</label>
                    <input type="text" name="park_name" required placeholder="Ej: Reserva Los Gigantes" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ubicación / Zona (Texto)</label>
                    <input type="text" name="location" required placeholder="Ej: Punilla, Córdoba" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- MAPA INTERACTIVO -->
            <div>
                <label class="block text-xs font-bold text-emerald-800 uppercase mb-1">📍 Haz clic en el mapa para marcar la ubicación exacta:</label>
                <div id="map" class="w-full h-64 rounded-2xl border border-slate-300 shadow-inner z-0"></div>
            </div>

            <!-- Coordenadas automáticas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Latitud</label>
                    <input type="text" id="input_lat" name="latitude" required readonly value="-31.4201" class="w-full bg-slate-200 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 font-mono">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Longitud</label>
                    <input type="text" id="input_lng" name="longitude" required readonly value="-64.4988" class="w-full bg-slate-200 border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700 font-mono">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Capacidad Máx</label>
                    <input type="number" name="max_capacity" value="200" required class="w-full bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs text-slate-700">
                </div>
            </div>

            <div class="border-t border-slate-200 pt-3 mt-2">
                <p class="text-xs font-bold text-emerald-800 mb-2 uppercase tracking-wide">Credenciales del Administrador</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuario Admin</label>
                        <input type="text" name="username" required placeholder="Ej: admin_gigantes" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
                        <input type="password" name="password" required placeholder="••••" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg mt-3">
                🚀 Registrar Parque y Cuenta
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/" class="text-xs font-semibold text-slate-500 hover:text-slate-800">← Volver al inicio</a>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([-31.4201, -64.4988], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([-31.4201, -64.4988], {draggable: true}).addTo(map);

        marker.on('dragend', function(e) {
            let position = marker.getLatLng();
            document.getElementById('input_lat').value = position.lat.toFixed(6);
            document.getElementById('input_lng').value = position.lng.toFixed(6);
        });

        map.on('click', function(e) {
            let lat = e.latlng.lat;
            let lng = e.latlng.lng;
            marker.setLatLng([lat, lng]);
            document.getElementById('input_lat').value = lat.toFixed(6);
            document.getElementById('input_lng').value = lng.toFixed(6);
        });
    </script>
</body>
</html>
