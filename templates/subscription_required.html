<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Requerida - TrailControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-rose-950 min-h-screen flex items-center justify-center p-6 text-slate-100">
    <div class="bg-slate-900 border border-rose-500/30 p-8 rounded-3xl shadow-2xl max-w-2xl w-full text-center">
        <span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[11px] font-bold px-3.5 py-1 rounded-full uppercase mb-2 inline-block">Prueba Gratuita Finalizada</span>
        <h1 class="text-2xl md:text-3xl font-black mb-2">Elegí tu plan para {{ park_name }}</h1>
        <p class="text-xs text-slate-300 mb-8">Tus 7 días de prueba han expirado. Seleccioná una opción para mantener tus senderos activos.</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                <div><h3 class="text-base font-black text-white">Mensual</h3><span class="text-2xl font-black text-emerald-400 mt-2 block">$34.000</span></div>
                <form action="/crear-suscripcion" method="POST" class="mt-6"><input type="hidden" name="plan" value="mensual"><button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs">Seleccionar</button></form>
            </div>
            <div class="bg-slate-950 border border-emerald-500/40 p-5 rounded-2xl flex flex-col justify-between relative">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-600 text-slate-950 font-black text-[9px] uppercase px-3 py-0.5 rounded-full">¡Ahorras 1 mes! (6x5)</div>
                <div><h3 class="text-base font-black text-white">6 Meses</h3><span class="text-2xl font-black text-emerald-400 mt-2 block">$170.000</span></div>
                <form action="/crear-suscripcion" method="POST" class="mt-6"><input type="hidden" name="plan" value="semestral"><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black py-2.5 rounded-xl text-xs">Elegir Semestral</button></form>
            </div>
            <div class="bg-slate-950 border border-emerald-500/60 p-5 rounded-2xl flex flex-col justify-between relative">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-black text-[9px] uppercase px-3 py-0.5 rounded-full">¡Ahorras 2 meses! (12x10)</div>
                <div><h3 class="text-base font-black text-white">12 Meses</h3><span class="text-2xl font-black text-emerald-400 mt-2 block">$340.000</span></div>
                <form action="/crear-suscripcion" method="POST" class="mt-6"><input type="hidden" name="plan" value="anual"><button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs">Elegir Anual</button></form>
            </div>
        </div>
        <a href="/logout" class="text-xs font-semibold text-slate-500 hover:text-slate-300">Cerrar Sesión 🚪</a>
    </div>
</body>
</html>
