<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - TrailControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white/95 backdrop-blur-xl p-8 rounded-3xl shadow-2xl max-w-md w-full text-slate-800 border border-emerald-900/10">
        <div class="text-center mb-6">
            <div class="inline-block bg-emerald-700 text-white p-3 rounded-2xl text-2xl shadow-md mb-3">🛡️</div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Acceso Administradores</h2>
            <p class="text-xs text-slate-500 mt-1">Ingresa con tus credenciales asignadas</p>
        </div>
        {% if error %}
            <div class="bg-rose-100 text-rose-700 text-xs font-bold p-3.5 rounded-xl mb-4 text-center">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Usuario</label>
                <input type="text" name="username" required placeholder="admin_parque" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-600">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Contraseña</label>
                <input type="password" name="password" required placeholder="••••" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-600">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-2">Ingresar al Panel</button>
        </form>
        <div class="mt-6 text-center"><a href="/" class="text-xs font-bold text-slate-500 hover:text-slate-800">← Volver al inicio</a></div>
    </div>
</body>
</html>
